name: Metrics
on:
  # Regenerate the dashboard every day at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow running it manually from the Actions tab
  workflow_dispatch:
  # And on every push to main
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # GitHub token (create it in your account settings, then add it
          # to this repo as a secret named METRICS_TOKEN)
          token: ${{ secrets.METRICS_TOKEN }}
          user: tahabentaleb
          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Africa/Casablanca
          # Isometric contributions calendar + current streak
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Language activity + most used languages
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          # Coding habits: commit activity per hour and per weekday
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_days: 14
          plugin_habits_commits: 100
          # Mastered technologies and topics icons
          plugin_topics: yes
          plugin_topics_limit: 24
